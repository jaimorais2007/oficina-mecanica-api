name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: mikionagayama/oficina-mecanica-api
  TERRAFORM_DIR: infra

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Run Tests
        run: dotnet test --no-build -c Release --verbosity normal

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        # TODO: Alterar para ECR ou registry privado, conforme a equipe definir.

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}, ${{ env.DOCKER_IMAGE_NAME }}:latest

  kubernetes-deploy:
    name: Provision infra & apply K8S Manifests (self-hosted / local k3s)
    runs-on: self-hosted
    needs: docker-build-push
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      KUBECONFIG: /etc/rancher/k3s/k3s.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Cluster k3s local + banco (docker-compose) - roda inteiramente neste servidor,
      # sem nenhum recurso de nuvem (ver infra/README.md)
      - name: Terraform apply (cluster local + banco)
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          kubectl delete service postgres-external --ignore-not-found -n default
          kubectl delete endpoints postgres-external --ignore-not-found -n default
          terraform init -input=false
          terraform apply -auto-approve -input=false

      - name: Gerar/atualizar Secret a partir do .env local
        run: ./scripts/generate-k8s-secret.sh

      # Substitui a imagem no deployment para a recém publicada no Docker Hub
      - name: Update Image in K8s Manifest
        run: |
          sed -i 's|image: .*|image: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}|g' k8s/deployment.yaml
          sed -i 's|imagePullPolicy: Never|imagePullPolicy: Always|g' k8s/deployment.yaml

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
